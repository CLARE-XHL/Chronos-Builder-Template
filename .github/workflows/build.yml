name: Build Chronos Seal

on:
  workflow_dispatch:
    inputs:
      game_name:
        description: '游戏名称（必填）'
        required: true
        type: string
      game_version:
        description: '游戏版本号（必填）'
        required: true
        type: string
      expiration_date:
        description: '截止日期（YYYY-MM-DD，留空永不过期）'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
      actions: write

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 缓存 vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-windows-${{ runner.os }}-20260905
          restore-keys: |
            vcpkg-windows-${{ runner.os }}-

      - name: 安装 OpenSSL
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg install openssl:x64-windows
        shell: powershell

      - name: 设置 OpenSSL 环境
        run: |
          $vcpkgRoot = (Get-Item .\vcpkg).FullName
          echo "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          echo "LIB=$env:LIB;$vcpkgRoot\installed\x64-windows\lib" >> $env:GITHUB_ENV
          echo "INCLUDE=$env:INCLUDE;$vcpkgRoot\installed\x64-windows\include" >> $env:GITHUB_ENV
        shell: powershell

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 node-gyp
        run: npm install -g node-gyp@9.4.0
        shell: powershell

      - name: 生成派生种子
        id: gen
        run: |
          $seed = [Convert]::ToBase64String((New-Object byte[] 32 | ForEach-Object { Get-Random -Maximum 256 }))
          echo "seed=$seed" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        shell: powershell

      - name: 解析截止日期
        id: expire
        run: |
          if ("${{ github.event.inputs.expiration_date }}" -eq "") {
            echo "timestamp=2147483647" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            $date = [datetime]::ParseExact("${{ github.event.inputs.expiration_date }}", "yyyy-MM-dd", $null)
            $timestamp = [int](($date.ToUniversalTime() - (Get-Date "1970-01-01")).TotalSeconds)
            echo "timestamp=$timestamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
        shell: powershell

      - name: 编译 decryptor.node
        run: |
          $vspath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -version "[17.0,18.0)" -property installationPath
          if (-not $vspath) {
            Write-Error "Visual Studio 2022 not found"
            exit 1
          }

          $env:VCINSTALLDIR = "$vspath\VC"
          $env:VSINSTALLDIR = $vspath
          $env:VCToolsInstallDir = "$vspath\VC\Tools\MSVC\14.44.35207"
          $env:VSCMD_ARG_TGT_ARCH = "x64"
          $env:VSCMD_ARG_HOST_ARCH = "x64"
          $env:PATH += ";$($env:VCToolsInstallDir)\bin\HostX64\x64"
          $env:INCLUDE = "$($env:VCToolsInstallDir)\include;$env:INCLUDE"
          $env:LIB = "$($env:VCToolsInstallDir)\lib\x64;$env:LIB"

          cd native

          $vcpkgRoot = $env:VCPKG_ROOT
          $openSslLibPath = "$vcpkgRoot\installed\x64-windows\lib"
          Write-Host "OpenSSL lib path: $openSslLibPath"

          # 动态生成 binding.gyp，使用绝对路径
          $bindingContent = @"
{
  "targets": [
    {
      "target_name": "decryptor",
      "sources": ["src/decryptor.cc"],
      "include_dirs": [
        "<!@(node -p \"require('node-addon-api').include\")"
      ],
      "libraries": [
        "$openSslLibPath\\libssl.lib",
        "$openSslLibPath\\libcrypto.lib"
      ],
      "defines": ["NAPI_DISABLE_CPP_EXCEPTIONS"]
    }
  ]
}
"@
          Set-Content -Path "binding.gyp" -Value $bindingContent

          # 确认文件存在
          Write-Host "=== Checking library files ==="
          Get-ChildItem $openSslLibPath -Filter *.lib | ForEach-Object { Write-Host $_.Name }

          # 安装 node-addon-api
          npm install node-addon-api

          # 生成 VS 项目
          node-gyp configure --msvs_version=2022

          # 编译
          node-gyp build --release --msvs_version=2022
        shell: powershell

      - name: 生成加密配置
        run: |
          $config = @{
            gameName = "${{ github.event.inputs.game_name }}"
            version = "${{ github.event.inputs.game_version }}"
            date = (Get-Date -Format "yyyy-MM-dd")
            seed = "${{ steps.gen.outputs.seed }}"
          }
          $json = $config | ConvertTo-Json
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("encrypt_config.json", $json, $utf8NoBom)
        shell: powershell

      - name: 生成作者密钥
        run: |
          $content = @"
          ============================================================
          Chronos Seal V2.1 — 作者专属密钥
          ⚠️ 此文件是游戏加密的唯一凭证，请妥善保管！
          游戏名称:     ${{ github.event.inputs.game_name }}
          版本号:       ${{ github.event.inputs.game_version }}
          发行日期:     $(Get-Date -Format "yyyy-MM-dd")
          截止日期:     ${{ github.event.inputs.expiration_date }}
          派生种子:     ${{ steps.gen.outputs.seed }}
          生成时间:     $(Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
          ============================================================
          警告：此文件绝对禁止随游戏发行包一起发布！
          ============================================================
          "@
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("author_secret.txt", $content, $utf8NoBom)
        shell: powershell

      - name: 校验产物
        id: verify
        run: |
          $nodePath = "native\build\Release\decryptor.node"
          if (-not (Test-Path $nodePath)) {
            Write-Error "decryptor.node not found at: $nodePath"
            exit 1
          }
          if (-not (Test-Path "encrypt_config.json")) {
            Write-Error "encrypt_config.json not found"
            exit 1
          }
          if (-not (Test-Path "author_secret.txt")) {
            Write-Error "author_secret.txt not found"
            exit 1
          }
          Write-Output "All artifacts generated successfully"
        shell: powershell

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: chronos-seal-output
          path: |
            native\build\Release\decryptor.node
            encrypt_config.json
            author_secret.txt
