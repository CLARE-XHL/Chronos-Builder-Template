name: Build Chronos Seal

on:
  workflow_dispatch:
    inputs:
      game_name:
        description: '游戏名称（必填）'
        required: true
        type: string
      game_version:
        description: '游戏版本号（必填）'
        required: true
        type: string
      expiration_date:
        description: '截止日期（YYYY-MM-DD，留空永不过期）'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
      actions: write

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装 OpenSSL（Chocolatey 预编译版）
        run: |
          choco install openssl -y
          echo "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL-Win64" >> $env:GITHUB_ENV
          echo "OPENSSL_LIBRARIES=C:\Program Files\OpenSSL-Win64\lib" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=C:\Program Files\OpenSSL-Win64\include" >> $env:GITHUB_ENV
        shell: powershell

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 node-addon-api
        run: npm install node-addon-api
        shell: powershell
        working-directory: native

      - name: 生成派生种子
        id: gen
        run: |
          $seed = [Convert]::ToBase64String((New-Object byte[] 32 | ForEach-Object { Get-Random -Maximum 256 }))
          echo "seed=$seed" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        shell: powershell

      - name: 解析截止日期
        id: expire
        run: |
          if ("${{ github.event.inputs.expiration_date }}" -eq "") {
            echo "timestamp=2147483647" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            $date = [datetime]::ParseExact("${{ github.event.inputs.expiration_date }}", "yyyy-MM-dd", $null)
            $timestamp = [int](($date.ToUniversalTime() - (Get-Date "1970-01-01")).TotalSeconds)
            echo "timestamp=$timestamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
        shell: powershell

      - name: 编译 decryptor.node
        run: |
          $vspath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -version "[17.0,18.0)" -property installationPath
          if (-not $vspath) {
            Write-Error "Visual Studio 2022 not found"
            exit 1
          }

          $env:VCINSTALLDIR = "$vspath\VC"
          $env:VSINSTALLDIR = "$vspath"
          $env:VCToolsInstallDir = "$vspath\VC\Tools\MSVC\14.44.35207"
          $env:VSCMD_ARG_TGT_ARCH = "x64"
          $env:VSCMD_ARG_HOST_ARCH = "x64"
          $env:PATH += ";$($env:VCToolsInstallDir)\bin\HostX64\x64"
          $env:INCLUDE = "$($env:VCToolsInstallDir)\include;C:\Program Files\OpenSSL-Win64\include;$env:INCLUDE"
          $env:LIB = "$($env:VCToolsInstallDir)\lib\x64;C:\Program Files\OpenSSL-Win64\lib;$env:LIB"

          cd native

          $nodeIncludePath = "$env:USERPROFILE\AppData\Local\node-gyp\Cache\18.20.8\include\node"
          if (-not (Test-Path $nodeIncludePath)) {
            $nodeInstall = (Get-Command node).Source
            $nodeIncludePath = Join-Path (Split-Path $nodeInstall -Parent) "include\node"
          }

          $openSslIncludePath = "C:\Program Files\OpenSSL-Win64\include"
          $openSslLibPath = "C:\Program Files\OpenSSL-Win64\lib"

          # 用 YAML 多行方式在 run: 里直接写 XML（用 -join 拼接数组，避免 YAML 解析问题）
          $xmlLines = @()
          $xmlLines += '<?xml version="1.0" encoding="utf-8"?>'
          $xmlLines += '<Project DefaultTargets="Build" ToolsVersion="15.0" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">'
          $xmlLines += '  <ItemGroup Label="ProjectConfigurations">'
          $xmlLines += '    <ProjectConfiguration Include="Release|x64">'
          $xmlLines += '      <Configuration>Release</Configuration>'
          $xmlLines += '      <Platform>x64</Platform>'
          $xmlLines += '    </ProjectConfiguration>'
          $xmlLines += '  </ItemGroup>'
          $xmlLines += '  <PropertyGroup Label="Globals">'
          $xmlLines += '    <VCProjectVersion>15.0</VCProjectVersion>'
          $xmlLines += '    <ProjectGuid>{7B6A0D0A-9B5E-4F5E-8B7A-6D5E4F3A2B1C}</ProjectGuid>'
          $xmlLines += '    <RootNamespace>decryptor</RootNamespace>'
          $xmlLines += '    <WindowsTargetPlatformVersion>10.0</WindowsTargetPlatformVersion>'
          $xmlLines += '  </PropertyGroup>'
          $xmlLines += '  <Import Project="$(VCTargetsPath)\Microsoft.Cpp.Default.props" />'
          $xmlLines += '  <PropertyGroup Condition="'\''$(Configuration)|$(Platform)'\''=='\''Release|x64'\''" Label="Configuration">'
          $xmlLines += '    <ConfigurationType>DynamicLibrary</ConfigurationType>'
          $xmlLines += '    <UseDebugLibraries>false</UseDebugLibraries>'
          $xmlLines += '    <PlatformToolset>v143</PlatformToolset>'
          $xmlLines += '    <CharacterSet>Unicode</CharacterSet>'
          $xmlLines += '  </PropertyGroup>'
          $xmlLines += '  <Import Project="$(VCTargetsPath)\Microsoft.Cpp.props" />'
          $xmlLines += '  <ImportGroup Label="ExtensionSettings"></ImportGroup>'
          $xmlLines += '  <ImportGroup Label="Shared"></ImportGroup>'
          $xmlLines += '  <ImportGroup Label="PropertySheets" Condition="'\''$(Configuration)|$(Platform)'\''=='\''Release|x64'\''">'
          $xmlLines += '    <Import Project="$(UserRootDir)\Microsoft.Cpp.$(Platform).user.props" Condition="exists('\''$(UserRootDir)\Microsoft.Cpp.$(Platform).user.props'\'')" Label="LocalAppPlatform" />'
          $xmlLines += '  </ImportGroup>'
          $xmlLines += '  <PropertyGroup Label="UserMacros" />'
          $xmlLines += '  <PropertyGroup Condition="'\''$(Configuration)|$(Platform)'\''=='\''Release|x64'\''">'
          $xmlLines += '    <TargetName>decryptor</TargetName>'
          $xmlLines += '    <TargetExt>.node</TargetExt>'
          $xmlLines += '    <IncludePath>$(VC_IncludePath);$(WindowsSDK_IncludePath);' + $nodeIncludePath + ';' + $openSslIncludePath + '</IncludePath>'
          $xmlLines += '  </PropertyGroup>'
          $xmlLines += '  <ItemDefinitionGroup Condition="'\''$(Configuration)|$(Platform)'\''=='\''Release|x64'\''">'
          $xmlLines += '    <ClCompile>'
          $xmlLines += '      <WarningLevel>Level3</WarningLevel>'
          $xmlLines += '      <Optimization>MaxSpeed</Optimization>'
          $xmlLines += '      <FunctionLevelLinking>true</FunctionLevelLinking>'
          $xmlLines += '      <IntrinsicFunctions>true</IntrinsicFunctions>'
          $xmlLines += '      <SDLCheck>true</SDLCheck>'
          $xmlLines += '      <ConformanceMode>true</ConformanceMode>'
          $xmlLines += '      <PreprocessorDefinitions>NAPI_DISABLE_CPP_EXCEPTIONS;WIN32;_CRT_SECURE_NO_DEPRECATE;_CRT_NONSTDC_NO_DEPRECATE;BUILDING_NODE_EXTENSION;%(PreprocessorDefinitions)</PreprocessorDefinitions>'
          $xmlLines += '      <AdditionalIncludeDirectories>' + $nodeIncludePath + ';' + $openSslIncludePath + ';.\node_modules\node-addon-api;%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories>'
          $xmlLines += '      <ExceptionHandling>false</ExceptionHandling>'
          $xmlLines += '      <LanguageStandard>stdcpp17</LanguageStandard>'
          $xmlLines += '    </ClCompile>'
          $xmlLines += '    <Link>'
          $xmlLines += '      <SubSystem>Console</SubSystem>'
          $xmlLines += '      <GenerateDebugInformation>true</GenerateDebugInformation>'
          $xmlLines += '      <EnableCOMDATFolding>true</EnableCOMDATFolding>'
          $xmlLines += '      <OptimizeReferences>true</OptimizeReferences>'
          $xmlLines += '      <AdditionalLibraryDirectories>' + $openSslLibPath + ';%(AdditionalLibraryDirectories)</AdditionalLibraryDirectories>'
          $xmlLines += '      <AdditionalDependencies>libssl.lib;libcrypto.lib;node.lib;kernel32.lib;user32.lib;%(AdditionalDependencies)</AdditionalDependencies>'
          $xmlLines += '      <ModuleDefinitionFile>win_delay_load_hook.cc</ModuleDefinitionFile>'
          $xmlLines += '      <DelayLoadDLLs>node.exe;%(DelayLoadDLLs)</DelayLoadDLLs>'
          $xmlLines += '    </Link>'
          $xmlLines += '  </ItemDefinitionGroup>'
          $xmlLines += '  <ItemGroup>'
          $xmlLines += '    <ClCompile Include="src\decryptor.cc" />'
          $xmlLines += '    <ClCompile Include="win_delay_load_hook.cc" />'
          $xmlLines += '  </ItemGroup>'
          $xmlLines += '  <Import Project="$(VCTargetsPath)\Microsoft.Cpp.targets" />'
          $xmlLines += '</Project>'

          $vcxprojContent = $xmlLines -join "`n"
          Set-Content -Path "decryptor.vcxproj" -Value $vcxprojContent

          # 生成 win_delay_load_hook.cc
          $hookContent = @"
#ifdef _MSC_VER
#pragma comment(linker, "/DELAYLOAD:node.exe")
#endif
"@
          Set-Content -Path "win_delay_load_hook.cc" -Value $hookContent

          # 查找 MSBuild
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe
          if (-not $msbuild) {
            Write-Error "MSBuild not found"
            exit 1
          }

          # 编译
          & $msbuild decryptor.vcxproj /p:Configuration=Release /p:Platform=x64 /p:AdditionalLibraryDirectories="$openSslLibPath" /p:AdditionalDependencies="libssl.lib;libcrypto.lib" /m

          # 复制产物到根目录
          if (Test-Path "Release\decryptor.node") {
            Copy-Item "Release\decryptor.node" "..\decryptor.node" -Force
          }
        shell: powershell

      - name: 生成加密配置
        run: |
          $config = @{
            gameName = "${{ github.event.inputs.game_name }}"
            version = "${{ github.event.inputs.game_version }}"
            date = (Get-Date -Format "yyyy-MM-dd")
            seed = "${{ steps.gen.outputs.seed }}"
          }
          $json = $config | ConvertTo-Json
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("encrypt_config.json", $json, $utf8NoBom)
        shell: powershell

      - name: 生成作者密钥
        run: |
          $content = @"
          ============================================================
          Chronos Seal V2.1 — 作者专属密钥
          ⚠️ 此文件是游戏加密的唯一凭证，请妥善保管！
          游戏名称:     ${{ github.event.inputs.game_name }}
          版本号:       ${{ github.event.inputs.game_version }}
          发行日期:     $(Get-Date -Format "yyyy-MM-dd")
          截止日期:     ${{ github.event.inputs.expiration_date }}
          派生种子:     ${{ steps.gen.outputs.seed }}
          生成时间:     $(Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
          ============================================================
          警告：此文件绝对禁止随游戏发行包一起发布！
          ============================================================
          "@
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("author_secret.txt", $content, $utf8NoBom)
        shell: powershell

      - name: 校验产物
        id: verify
        run: |
          if (-not (Test-Path "decryptor.node")) {
            Write-Error "decryptor.node not found"
            exit 1
          }
          if (-not (Test-Path "encrypt_config.json")) {
            Write-Error "encrypt_config.json not found"
            exit 1
          }
          if (-not (Test-Path "author_secret.txt")) {
            Write-Error "author_secret.txt not found"
            exit 1
          }
          Write-Output "All artifacts generated successfully"
        shell: powershell

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: chronos-seal-output
          path: |
            decryptor.node
            encrypt_config.json
            author_secret.txt
