name: Build Chronos Seal

on:
  workflow_dispatch:
    inputs:
      game_name:
        description: '游戏名称（必填，1-64 字符）'
        required: true
        type: string
      game_version:
        description: '游戏版本号（必填，仅字母数字 . _ -）'
        required: true
        type: string

env:
  CS_GAME_NAME: ${{ github.event.inputs.game_name }}
  CS_GAME_VERSION: ${{ github.event.inputs.game_version }}

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 校验输入
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CS_GAME_NAME)) { Write-Error "game_name empty"; exit 1 }
          if ($env:CS_GAME_NAME.Length -gt 64) { Write-Error "game_name too long"; exit 1 }
          if ($env:CS_GAME_VERSION -notmatch '^[0-9A-Za-z._-]+$') { Write-Error "game_version invalid"; exit 1 }
          Write-Output "Input OK"

      - name: 计算构建日期
        id: build_date
        shell: pwsh
        run: |
          $date = Get-Date -Format 'yyyy-MM-dd'
          "date=$date" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "Build date: $date"

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 node-gyp
        shell: pwsh
        run: npm install -g node-gyp@9.4.0

      - name: 安装 node-addon-api (锁定版本)
        shell: pwsh
        working-directory: native
        run: npm install --ignore-scripts

      - name: 生成分片种子
        id: gen
        shell: pwsh
        run: |
          function New-Hex([int]$n) {
            $b = New-Object byte[] $n
            [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($b)
            return -join ($b | ForEach-Object { $_.ToString('x2') })
          }
          $seedA = New-Hex 12
          $seedB = New-Hex 12
          $seedC = New-Hex 12
          $seedD = New-Hex 12
          $saltBytes = New-Object byte[] 4
          [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($saltBytes)
          $seedSalt = [BitConverter]::ToUInt32($saltBytes, 0)

          "seed_a=$seedA" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "seed_b=$seedB" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "seed_c=$seedC" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "seed_d=$seedD" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "seed_salt=$seedSalt" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $fullSeed = $seedA + $seedB + $seedC + $seedD
          "seed=$fullSeed" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "Seeds generated"

      # ★ 生成字符串密文表（混入 build salt）
      - name: 生成字符串密文表
        shell: pwsh
        env:
          CS_BUILD_SALT: ${{ steps.gen.outputs.seed_salt }}
        run: |
          $content = & python tools/gen_str_table.py
          if ($LASTEXITCODE -ne 0) { Write-Error "gen_str_table failed"; exit 1 }
          if (-not $content) { Write-Error "no output"; exit 1 }
          [System.IO.File]::WriteAllLines(
            (Resolve-Path "native").Path + "\src\cs_str_table.h",
            $content,
            [System.Text.Encoding]::ASCII
          )
          $size = (Get-Item "native\src\cs_str_table.h").Length
          if ($size -lt 1000) { Write-Error "too small"; exit 1 }
          Write-Output "cs_str_table.h: $size bytes"

      # ★ 生成 build_config.h（用 env: 传种子，不进日志）
      - name: 生成 build_config.h
        shell: pwsh
        env:
          BC_GAME_VERSION: ${{ github.event.inputs.game_version }}
          BC_RELEASE_DATE: ${{ steps.build_date.outputs.date }}
          BC_SEED_A: ${{ steps.gen.outputs.seed_a }}
          BC_SEED_B: ${{ steps.gen.outputs.seed_b }}
          BC_SEED_C: ${{ steps.gen.outputs.seed_c }}
          BC_SEED_D: ${{ steps.gen.outputs.seed_d }}
          BC_SEED_SALT: ${{ steps.gen.outputs.seed_salt }}
        run: |
          $lines = @(
            "#pragma once",
            "#define GAME_VERSION `"$env:BC_GAME_VERSION`"",
            "#define RELEASE_DATE `"$env:BC_RELEASE_DATE`"",
            "#define SEED_A       `"$env:BC_SEED_A`"",
            "#define SEED_B       `"$env:BC_SEED_B`"",
            "#define SEED_C       `"$env:BC_SEED_C`"",
            "#define SEED_D       `"$env:BC_SEED_D`"",
            "#define SEED_SALT    $($env:BC_SEED_SALT)u",
            ""
          )
          [System.IO.File]::WriteAllLines(
            "native\src\build_config.h", $lines, [System.Text.Encoding]::ASCII)

          # 生成后立即校验，防止静默降级回落到源码默认值
          $p = "native\src\build_config.h"
          if (-not (Test-Path $p)) { Write-Error "build_config.h not created"; exit 1 }
          $c = Get-Content $p -Raw
          if ($c -match 'REPLACE_ME' -or $c -notmatch 'SEED_A') {
            Write-Error "build_config.h has placeholder or missing SEED_A"
            exit 1
          }
          if ($c -match 'SEED_SALT\s+0x9E3779B9u') {
            Write-Error "build_config.h still contains default SEED_SALT"
            exit 1
          }
          Write-Output "build_config.h generated and verified"

      - name: 编译 decryptor.node
        shell: pwsh
        run: |
          $vspath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -version "[17.0,18.0)" -property installationPath
          if (-not $vspath) { Write-Error "VS2022 not found"; exit 1 }
          $msvcVersion = Get-ChildItem "$vspath\VC\Tools\MSVC" | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1 | Select-Object -ExpandProperty Name
          $env:VCINSTALLDIR = "$vspath\VC"
          $env:VSINSTALLDIR = "$vspath"
          $env:VCToolsInstallDir = "$vspath\VC\Tools\MSVC\$msvcVersion"
          $env:VSCMD_ARG_TGT_ARCH = "x64"
          $env:VSCMD_ARG_HOST_ARCH = "x64"
          $env:PATH += ";$($env:VCToolsInstallDir)\bin\HostX64\x64"
          cd native
          node-gyp configure --msvs_version=2022 --arch=x64
          node-gyp build --release --msvs_version=2022 --arch=x64

      - name: 生成加密配置
        shell: pwsh
        env:
          CFG_GAME_NAME: ${{ github.event.inputs.game_name }}
          CFG_GAME_VERSION: ${{ github.event.inputs.game_version }}
          CFG_DATE: ${{ steps.build_date.outputs.date }}
          CFG_SEED: ${{ steps.gen.outputs.seed }}
          CFG_SEED_SALT: ${{ steps.gen.outputs.seed_salt }}
        run: |
          $config = [ordered]@{
            gameName = $env:CFG_GAME_NAME
            version  = $env:CFG_GAME_VERSION
            date     = $env:CFG_DATE
            seed     = $env:CFG_SEED
            seedSalt = [uint32]$env:CFG_SEED_SALT
          }
          $json = $config | ConvertTo-Json
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("encrypt_config.json", $json, $utf8NoBom)

      - name: 生成作者密钥
        shell: pwsh
        env:
          AK_GAME_NAME: ${{ github.event.inputs.game_name }}
          AK_GAME_VERSION: ${{ github.event.inputs.game_version }}
          AK_DATE: ${{ steps.build_date.outputs.date }}
          AK_SEED: ${{ steps.gen.outputs.seed }}
          AK_SEED_SALT: ${{ steps.gen.outputs.seed_salt }}
        run: |
          $content = @"
          ============================================================
          Chronos Seal V2.2 - Author Secret Key
          WARNING: Keep it safe!
          Game Name:       $env:AK_GAME_NAME
          Version:         $env:AK_GAME_VERSION
          Engine Target:   MZ_64bit
          Release Date:    $env:AK_DATE
          Derivation Seed: $env:AK_SEED
          Seed Salt:       $env:AK_SEED_SALT
          Generated:       $(Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
          ============================================================
          WARNING: DO NOT distribute this file with your game package!
          ============================================================
          "@
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("author_secret.txt", $content, $utf8NoBom)

      - name: 校验产物
        shell: pwsh
        run: |
          $p = "native\build\Release\decryptor.node"
          if (-not (Test-Path $p)) { Write-Error "decryptor.node missing"; exit 1 }
          if (-not (Test-Path "encrypt_config.json")) { Write-Error "config missing"; exit 1 }
          if (-not (Test-Path "author_secret.txt")) { Write-Error "secret missing"; exit 1 }
          Write-Output "All artifacts present"

      - name: 校验产物无明文 tag
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("native\build\Release\decryptor.node")
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          $patterns = @('MASTER:', 'STAGE2:', 'STAGE3:', 'MASTER:FINAL',
                        'AES:S1:', 'AES:S2:', 'AES:S3:', 'AES:FINAL:',
                        'HMAC:S1:', 'HMAC:S2:', 'HMAC:S3:', 'HMAC:FINAL:')
          $found = @()
          foreach ($p in $patterns) { if ($text.Contains($p)) { $found += $p } }
          if ($found.Count -gt 0) { Write-Error "FAIL: $($found -join ', ')"; exit 1 }
          Write-Output "OK: no plaintext tags"

      - name: 校验 SEED 已编入二进制
        shell: pwsh
        env:
          CHK_A: ${{ steps.gen.outputs.seed_a }}
          CHK_B: ${{ steps.gen.outputs.seed_b }}
          CHK_C: ${{ steps.gen.outputs.seed_c }}
          CHK_D: ${{ steps.gen.outputs.seed_d }}
        run: |
          # 长度兜底：seed 生成失败时给出明确报错，而不是 PowerShell 异常栈
          if ($env:CHK_A.Length -lt 16 -or $env:CHK_B.Length -lt 16 -or
              $env:CHK_C.Length -lt 16 -or $env:CHK_D.Length -lt 16) {
            Write-Error "Seed outputs too short. gen step failed."
            exit 1
          }

          $bytes = [System.IO.File]::ReadAllBytes("native\build\Release\decryptor.node")
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)

          $missing = @()
          if (-not $text.Contains($env:CHK_A.Substring(0, 16))) { $missing += 'SEED_A' }
          if (-not $text.Contains($env:CHK_B.Substring(0, 16))) { $missing += 'SEED_B' }
          if (-not $text.Contains($env:CHK_C.Substring(0, 16))) { $missing += 'SEED_C' }
          if (-not $text.Contains($env:CHK_D.Substring(0, 16))) { $missing += 'SEED_D' }

          if ($missing.Count -gt 0) {
            Write-Error "FAIL: $($missing -join ', ') not found in binary"
            Write-Error "说明: build_config.h 未生效，或 -D 宏传递失败"
            exit 1
          }
          Write-Output "OK: SEED anchors present"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: chronos-seal-output-MZ
          retention-days: 1
          path: |
            native\build\Release\decryptor.node
            encrypt_config.json
            author_secret.txt
