name: Build Chronos Seal

on:
  workflow_dispatch:
    inputs:
      game_name:
        description: '游戏名称（如 MyGame）'
        required: true
        type: string
      game_version:
        description: '游戏版本号（如 1.0.0）'
        required: true
        type: string
      expiration_date:
        description: '时间炸弹截止日期（YYYY-MM-DD，留空则永不过期）'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: windows-2019
    permissions:
      contents: read
      actions: write

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      # ============================================================
      # 1. 读取 system.json 获取游戏名称和版本号
      # ============================================================
      - name: 读取 system.json
        id: read_system
        run: |
          if (Test-Path "system.json") {
            $json = Get-Content -Path "system.json" -Raw | ConvertFrom-Json
            $gameTitle = $json.gameTitle
            if ([string]::IsNullOrEmpty($gameTitle)) {
              $gameTitle = "${{ github.event.inputs.game_name }}"
            }
            echo "game_title=$gameTitle" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            echo "✅ system.json 读取成功: $gameTitle"
          } else {
            echo "⚠️ system.json 不存在，使用输入的游戏名称"
            echo "game_title=${{ github.event.inputs.game_name }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
        shell: powershell

      # ============================================================
      # 2. 安装 OpenSSL（vcpkg 方式）
      # ============================================================
      - name: 安装 OpenSSL
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg install openssl:x64-windows
          echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" >> $env:GITHUB_ENV
          echo "LIB=$env:LIB;$env:GITHUB_WORKSPACE\vcpkg\installed\x64-windows\lib" >> $env:GITHUB_ENV
          echo "INCLUDE=$env:INCLUDE;$env:GITHUB_WORKSPACE\vcpkg\installed\x64-windows\include" >> $env:GITHUB_ENV
        shell: powershell

      # ============================================================
      # 3. 安装 Node.js 14.x（匹配 NW.js 0.48 的 ABI）
      # ============================================================
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14.x'

      - name: 安装 node-gyp
        run: npm install -g node-gyp

      # ============================================================
      # 4. 生成随机派生种子
      # ============================================================
      - name: 生成派生种子
        id: gen
        run: |
          $seed = [Convert]::ToBase64String((New-Object byte[] 32 | ForEach-Object { Get-Random -Maximum 256 }))
          echo "seed=$seed" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        shell: powershell

      # ============================================================
      # 5. 解析截止日期
      # ============================================================
      - name: 解析截止日期
        id: expire
        run: |
          if ("${{ github.event.inputs.expiration_date }}" -eq "") {
            echo "timestamp=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            $date = [datetime]::ParseExact("${{ github.event.inputs.expiration_date }}", "yyyy-MM-dd", $null)
            $timestamp = [int](($date.ToUniversalTime() - (Get-Date "1970-01-01")).TotalSeconds)
            echo "timestamp=$timestamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
        shell: powershell

      # ============================================================
      # 6. 编译 decryptor.node（通过 -D 宏传入参数）
      # ============================================================
      - name: 编译 decryptor.node
        run: |
          cd native
          node-gyp configure
          node-gyp build --release `
            -DGAME_VERSION="${{ github.event.inputs.game_version }}" `
            -DRELEASE_DATE="$(Get-Date -Format 'yyyy-MM-dd')" `
            -DDERIVATION_SEED="${{ steps.gen.outputs.seed }}" `
            -DHARD_EXPIRE="${{ steps.expire.outputs.timestamp }}" `
            -DWATCHDOG_TIMEOUT_SEC=10 `
            -DWATCHDOG_MAX_MISS=2
        shell: powershell

      # ============================================================
      # 7. 生成 encrypt_config.json（给本地加密脚本用）
      # ============================================================
      - name: 生成加密配置
        run: |
          $config = @{
            gameName = "${{ steps.read_system.outputs.game_title }}"
            version = "${{ github.event.inputs.game_version }}"
            date = (Get-Date -Format "yyyy-MM-dd")
            seed = "${{ steps.gen.outputs.seed }}"
          }
          $json = $config | ConvertTo-Json
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("encrypt_config.json", $json, $utf8NoBom)
        shell: powershell

      # ============================================================
      # 8. 生成 author_secret.txt（作者备份密钥）
      # ============================================================
      - name: 生成作者密钥
        run: |
          $content = @"
          ============================================================
          Chronos Seal V2.1 — 作者专属密钥
          ⚠️ 此文件是游戏加密的唯一凭证，请妥善保管！
          游戏名称:     ${{ steps.read_system.outputs.game_title }}
          版本号:       ${{ github.event.inputs.game_version }}
          发行日期:     $(Get-Date -Format "yyyy-MM-dd")
          截止日期:     ${{ github.event.inputs.expiration_date }}
          派生种子:     ${{ steps.gen.outputs.seed }}
          生成时间:     $(Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
          ============================================================
          警告：此文件绝对禁止随游戏发行包一起发布！
          ============================================================
          "@
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("author_secret.txt", $content, $utf8NoBom)
        shell: powershell

      # ============================================================
      # 9. 输出校验
      # ============================================================
      - name: 校验产物
        id: verify
        run: |
          if (-not (Test-Path "native\build\Release\decryptor.node")) {
            Write-Error "编译失败：decryptor.node 未生成"
            exit 1
          }
          if (-not (Test-Path "encrypt_config.json")) {
            Write-Error "加密配置未生成"
            exit 1
          }
          if (-not (Test-Path "author_secret.txt")) {
            Write-Error "作者密钥未生成"
            exit 1
          }
          Write-Output "✅ 所有产物生成成功"
        shell: powershell

      # ============================================================
      # 10. 上传产物
      # ============================================================
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: chronos-seal-output
          path: |
            native\build\Release\decryptor.node
            encrypt_config.json
            author_secret.txt
