name: Build Chronos Seal

on:
  workflow_dispatch:
    inputs:
      game_name:
        description: '游戏名称（必填）'
        required: true
        type: string
      game_version:
        description: '游戏版本号（必填，仅字母数字 . _ -）'
        required: true
        type: string

env:
  # 环境变量传参，避免用户输入被 PowerShell 解释器当作代码执行
  CS_GAME_NAME: ${{ github.event.inputs.game_name }}
  CS_GAME_VERSION: ${{ github.event.inputs.game_version }}

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
      actions: write

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 校验输入
        run: |
          if ($env:CS_GAME_VERSION -notmatch '^[0-9A-Za-z._-]+$') {
            Write-Error "game_version 只能包含字母数字和 . _ -，当前值: $env:CS_GAME_VERSION"
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:CS_GAME_NAME)) {
            Write-Error "game_name 不能为空"
            exit 1
          }
          Write-Output "输入校验通过: name=$env:CS_GAME_NAME version=$env:CS_GAME_VERSION"
        shell: powershell

      - name: 计算构建日期
        id: build_date
        run: |
          $date = Get-Date -Format 'yyyy-MM-dd'
          echo "date=$date" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "Build date: $date"
        shell: powershell

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 node-gyp
        run: npm install -g node-gyp@9.4.0
        shell: powershell

      - name: 安装 node-addon-api (锁定版本)
        # --ignore-scripts 防止 package.json 里若有 install 脚本
        # 提前触发一次无 -D 的编译，污染构建产物
        run: npm install --ignore-scripts
        shell: powershell
        working-directory: native

      # ★ P1：生成字符串密文表
      # 由 tools/gen_str_table.py 生成 native/src/cs_str_table.h
      # 使用 .NET API 写 ASCII 无 BOM 文件，避免 PowerShell 默认 UTF-16LE 破坏 #include
      - name: 生成字符串密文表
        run: |
          $content = & python tools/gen_str_table.py
          if (-not $content) {
            Write-Error "gen_str_table.py produced no output"
            exit 1
          }
          [System.IO.File]::WriteAllLines(
            (Resolve-Path "native").Path + "\src\cs_str_table.h",
            $content,
            [System.Text.Encoding]::ASCII
          )
          $headerPath = "native\src\cs_str_table.h"
          if (-not (Test-Path $headerPath)) {
            Write-Error "cs_str_table.h not created"
            exit 1
          }
          $size = (Get-Item $headerPath).Length
          Write-Output "cs_str_table.h generated: $size bytes"
          Get-Content $headerPath -TotalCount 5 | ForEach-Object { Write-Output $_ }
        shell: powershell

      # ★ V2.2：生成分片种子
      # 用 Hex 而非 Base64：Hex 只有 [0-9a-f]，在 node-gyp → MSBuild → cl.exe
      # 的多层传参里不会被解释为特殊字符
      - name: 生成分片种子
        id: gen
        run: |
          function New-Hex([int]$n) {
            $b = New-Object byte[] $n
            [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($b)
            return -join ($b | ForEach-Object { $_.ToString('x2') })
          }

          $seedA = New-Hex 12
          $seedB = New-Hex 12
          $seedC = New-Hex 12
          $seedD = New-Hex 12

          $saltBytes = New-Object byte[] 4
          [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($saltBytes)
          $seedSalt = [BitConverter]::ToUInt32($saltBytes, 0)

          echo "seed_a=$seedA" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "seed_b=$seedB" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "seed_c=$seedC" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "seed_d=$seedD" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "seed_salt=$seedSalt" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          $fullSeed = $seedA + $seedB + $seedC + $seedD
          echo "seed=$fullSeed" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Output "Seeds generated (hex, 24 chars each)"
          Write-Output "seed_a anchor: $($seedA.Substring(0,8))..."
        shell: powershell

      - name: 编译 decryptor.node (MZ / x64)
        run: |
          $vspath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -version "[17.0,18.0)" -property installationPath
          if (-not $vspath) { Write-Error "Visual Studio 2022 not found"; exit 1 }

          $arch = "x64"
          $vsTarget = "x64"
          $hostPath = "HostX64\x64"

          $msvcVersion = Get-ChildItem "$vspath\VC\Tools\MSVC" | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1 | Select-Object -ExpandProperty Name

          $env:VCINSTALLDIR = "$vspath\VC"
          $env:VSINSTALLDIR = "$vspath"
          $env:VCToolsInstallDir = "$vspath\VC\Tools\MSVC\$msvcVersion"
          $env:VSCMD_ARG_TGT_ARCH = $vsTarget
          $env:VSCMD_ARG_HOST_ARCH = "x64"
          $env:PATH += ";$($env:VCToolsInstallDir)\bin\$hostPath"

          cd native

          # 所有 -D 宏必须在 configure 阶段传入
          # build 阶段会忽略 -D，导致宏使用源码默认值
          # SEED 用 Hex，无特殊字符，避免多层传参被解释
          # RELEASE_DATE 用统一的 build_date，避免跨天不一致
          node-gyp configure --msvs_version=2022 --arch=$arch `
            -DGAME_VERSION="$env:CS_GAME_VERSION" `
            -DRELEASE_DATE="${{ steps.build_date.outputs.date }}" `
            -DSEED_A="'${{ steps.gen.outputs.seed_a }}'" `
            -DSEED_B="'${{ steps.gen.outputs.seed_b }}'" `
            -DSEED_C="'${{ steps.gen.outputs.seed_c }}'" `
            -DSEED_D="'${{ steps.gen.outputs.seed_d }}'" `
            -DSEED_SALT=${{ steps.gen.outputs.seed_salt }}u

          node-gyp build --release --msvs_version=2022 --arch=$arch
        shell: powershell

      - name: 生成加密配置
        run: |
          $config = [ordered]@{
            gameName = $env:CS_GAME_NAME
            version  = $env:CS_GAME_VERSION
            date     = "${{ steps.build_date.outputs.date }}"
            seed     = "${{ steps.gen.outputs.seed }}"
            seedSalt = [uint32]"${{ steps.gen.outputs.seed_salt }}"
          }
          $json = $config | ConvertTo-Json
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("encrypt_config.json", $json, $utf8NoBom)
        shell: powershell

      - name: 生成作者密钥
        run: |
          $content = @"
          ============================================================
          Chronos Seal V2.2 - Author Secret Key
          WARNING: This file is the sole credential for game encryption. Keep it safe!
          Game Name:       $env:CS_GAME_NAME
          Version:         $env:CS_GAME_VERSION
          Engine Target:   MZ_64bit
          Release Date:    ${{ steps.build_date.outputs.date }}
          Derivation Seed: ${{ steps.gen.outputs.seed }}
          Seed Salt:       ${{ steps.gen.outputs.seed_salt }}
          Generated:       $(Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
          ============================================================
          WARNING: DO NOT distribute this file with your game package!
          ============================================================
          "@
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("author_secret.txt", $content, $utf8NoBom)
        shell: powershell

      - name: 校验产物
        id: verify
        run: |
          $nodePath = "native\build\Release\decryptor.node"
          if (-not (Test-Path $nodePath)) {
            Write-Error "decryptor.node not found at: $nodePath"
            exit 1
          }
          if (-not (Test-Path "encrypt_config.json")) {
            Write-Error "encrypt_config.json not found"
            exit 1
          }
          if (-not (Test-Path "author_secret.txt")) {
            Write-Error "author_secret.txt not found"
            exit 1
          }
          Write-Output "All artifacts generated successfully"
        shell: powershell

      # ★ P1 验收：二进制里不能出现任何 tag 明文
      - name: 校验产物无明文 tag
        run: |
          $nodePath = "native\build\Release\decryptor.node"
          if (-not (Test-Path $nodePath)) {
            Write-Error "decryptor.node not found at: $nodePath"
            exit 1
          }

          $bytes = [System.IO.File]::ReadAllBytes($nodePath)
          $text  = [System.Text.Encoding]::ASCII.GetString($bytes)

          $patterns = @(
            'MASTER:', 'STAGE2:', 'STAGE3:', 'MASTER:FINAL',
            'AES:S1:', 'AES:S2:', 'AES:S3:', 'AES:FINAL:',
            'HMAC:S1:', 'HMAC:S2:', 'HMAC:S3:', 'HMAC:FINAL:'
          )

          $found = @()
          foreach ($p in $patterns) {
            if ($text.Contains($p)) {
              $found += $p
            }
          }

          if ($found.Count -gt 0) {
            Write-Error "FAIL: plaintext tags found in binary: $($found -join ', ')"
            Write-Error "说明: cs_str_table.h 未正确生成，或 decryptor.cc 未使用 CS_DECODE_* 宏"
            exit 1
          }

          Write-Output "OK: no plaintext tags found in decryptor.node"
        shell: powershell

      # ★ 校验 SEED 已编入二进制
      # fork 用户无法本地验证，此步替他验证 -D 是否生效
      - name: 校验 SEED 已编入二进制
        run: |
          $nodePath = "native\build\Release\decryptor.node"
          if (-not (Test-Path $nodePath)) {
            Write-Error "decryptor.node not found at: $nodePath"
            exit 1
          }

          $bytes = [System.IO.File]::ReadAllBytes($nodePath)
          $text  = [System.Text.Encoding]::ASCII.GetString($bytes)

          $seedA = "${{ steps.gen.outputs.seed_a }}"
          $seedB = "${{ steps.gen.outputs.seed_b }}"
          $seedC = "${{ steps.gen.outputs.seed_c }}"
          $seedD = "${{ steps.gen.outputs.seed_d }}"

          if ($seedA.Length -lt 16 -or $seedB.Length -lt 16 -or
              $seedC.Length -lt 16 -or $seedD.Length -lt 16) {
            Write-Error "Seed values too short. gen step may have failed."
            exit 1
          }

          $anchors = @(
            @{ Name = 'SEED_A'; Value = $seedA.Substring(0, 16) },
            @{ Name = 'SEED_B'; Value = $seedB.Substring(0, 16) },
            @{ Name = 'SEED_C'; Value = $seedC.Substring(0, 16) },
            @{ Name = 'SEED_D'; Value = $seedD.Substring(0, 16) }
          )

          $missing = @()
          foreach ($a in $anchors) {
            if (-not $text.Contains($a.Value)) {
              $missing += $a.Name
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error "FAIL: $($missing -join ', ') not found in binary"
            Write-Error "说明: -D 宏未在 configure 阶段生效，或 SEED 值未编入代码"
            exit 1
          }

          Write-Output "OK: SEED_A/B/C/D anchors present in binary"
        shell: powershell

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: chronos-seal-output-MZ
          path: |
            native\build\Release\decryptor.node
            encrypt_config.json
            author_secret.txt
