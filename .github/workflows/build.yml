name: Build Chronos Seal

on:
  workflow_dispatch:
    inputs:
      game_name:
        description: '游戏名称（必填）'
        required: true
        type: string
      game_version:
        description: '游戏版本号（必填）'
        required: true
        type: string
      engine_target:
        description: '选择引擎架构 (MV是32位, MZ是64位)'
        required: true
        type: choice
        options:
          - MV_32bit
          - MZ_64bit
      expiration_date:
        description: '截止日期（YYYY-MM-DD，留空永不过期）'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
      actions: write

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 node-gyp
        run: npm install -g node-gyp@9.4.0
        shell: powershell

      - name: 安装 node-addon-api
        run: npm install node-addon-api
        shell: powershell
        working-directory: native

      - name: 生成派生种子（32字节强随机）
        id: gen
        run: |
          $bytes = New-Object byte[] 32
          (New-Object System.Security.Cryptography.RNGCryptoServiceProvider).GetBytes($bytes)
          $seed = [Convert]::ToBase64String($bytes)
          echo "seed=$seed" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        shell: powershell

      - name: 解析截止日期
        id: expire
        run: |
          if ("${{ github.event.inputs.expiration_date }}" -eq "") {
            echo "timestamp=2147483647" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            $date = [datetime]::ParseExact("${{ github.event.inputs.expiration_date }}", "yyyy-MM-dd", $null)
            $timestamp = [int](($date.ToUniversalTime() - (Get-Date "1970-01-01")).TotalSeconds)
            echo "timestamp=$timestamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
        shell: powershell

      - name: 编译 decryptor.node
        run: |
          $vspath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -version "[17.0,18.0)" -property installationPath
          if (-not $vspath) {
            Write-Error "Visual Studio 2022 not found"
            exit 1
          }

          # 动态判断架构 (Node 的 ia32 对应 MSVC 的 x86)
          if ("${{ github.event.inputs.engine_target }}" -eq "MV_32bit") {
            $arch = "ia32"
            $vsTarget = "x86"
            $hostPath = "HostX64\x86" # 64位宿主环境编译32位目标
          } else {
            $arch = "x64"
            $vsTarget = "x64"
            $hostPath = "HostX64\x64"
          }

          $env:VCINSTALLDIR = "$vspath\VC"
          $env:VSINSTALLDIR = "$vspath"
          $env:VCToolsInstallDir = "$vspath\VC\Tools\MSVC\14.44.35207"
          $env:VSCMD_ARG_TGT_ARCH = $vsTarget
          $env:VSCMD_ARG_HOST_ARCH = "x64"
          $env:PATH += ";$($env:VCToolsInstallDir)\bin\$hostPath"

          cd native

          # 加上 --arch 参数，并将动态变量传入
          node-gyp configure --msvs_version=2022 --arch=$arch
          node-gyp build --release --msvs_version=2022 --arch=$arch `
            -DGAME_VERSION="${{ github.event.inputs.game_version }}" `
            -DRELEASE_DATE="$(Get-Date -Format 'yyyy-MM-dd')" `
            -DDERIVATION_SEED="${{ steps.gen.outputs.seed }}" `
            -DHARD_EXPIRE="${{ steps.expire.outputs.timestamp }}" `
            -DWATCHDOG_TIMEOUT_SEC=10 `
            -DWATCHDOG_MAX_MISS=2
        shell: powershell

      - name: 生成加密配置
        run: |
          $config = @{
            gameName = "${{ github.event.inputs.game_name }}"
            version = "${{ github.event.inputs.game_version }}"
            date = (Get-Date -Format "yyyy-MM-dd")
            seed = "${{ steps.gen.outputs.seed }}"
            arch = "${{ github.event.inputs.engine_target }}"
          }
          $json = $config | ConvertTo-Json
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("encrypt_config.json", $json, $utf8NoBom)
        shell: powershell

      - name: 生成作者密钥
        run: |
          $content = @"
          ============================================================
          Chronos Seal V2.1 - Author Secret Key
          WARNING: This file is the sole credential for game encryption. Keep it safe!
          Game Name:     ${{ github.event.inputs.game_name }}
          Version:       ${{ github.event.inputs.game_version }}
          Engine Target: ${{ github.event.inputs.engine_target }}
          Release Date:  $(Get-Date -Format "yyyy-MM-dd")
          Expiration:    ${{ github.event.inputs.expiration_date }}
          Derivation Seed: ${{ steps.gen.outputs.seed }}
          Generated:     $(Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
          ============================================================
          WARNING: DO NOT distribute this file with your game package!
          ============================================================
          "@
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("author_secret.txt", $content, $utf8NoBom)
        shell: powershell

      - name: 校验产物
        id: verify
        run: |
          $nodePath = "native\build\Release\decryptor.node"
          if (-not (Test-Path $nodePath)) {
            Write-Error "decryptor.node not found at: $nodePath"
            exit 1
          }
          if (-not (Test-Path "encrypt_config.json")) {
            Write-Error "encrypt_config.json not found"
            exit 1
          }
          if (-not (Test-Path "author_secret.txt")) {
            Write-Error "author_secret.txt not found"
            exit 1
          }
          Write-Output "All artifacts generated successfully"
        shell: powershell

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          # 动态拼装产物名字，防止用户下错
          name: chronos-seal-output-${{ github.event.inputs.engine_target }}
          path: |
            native\build\Release\decryptor.node
            encrypt_config.json
            author_secret.txt
