name: Chronos Seal V2.0 Builder

on:
  workflow_dispatch:
    inputs:
      game_name:
        description: '游戏名称（如 MyGame）'
        required: true
        type: string
      game_version:
        description: '游戏版本号（如 1.0.0）'
        required: true
        type: string
      expiration_date:
        description: '时间炸弹截止日期（YYYY-MM-DD，留空则永不过期）'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make nodejs npm openssl
          sudo npm install -g node-gyp

      - name: 解析时间炸弹截止日期
        id: expire
        run: |
          if [ -z "${{ github.event.inputs.expiration_date }}" ]; then
            echo "timestamp=0" >> $GITHUB_OUTPUT
          else
            TIMESTAMP=$(date -d "${{ github.event.inputs.expiration_date }}" +%s 2>/dev/null || echo "0")
            echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          fi

      - name: 生成随机 Salt 和 IV（零知识，不落日志）
        id: gen
        run: |
          SALT=$(openssl rand -base64 32)
          IV=$(openssl rand -hex 16)
          echo "salt=$SALT" >> $GITHUB_OUTPUT
          echo "iv=$IV" >> $GITHUB_OUTPUT

      - name: 动态生成完整 config.h（合并检查点白名单）
        run: |
          cat > src/config.h << 'EOF'
          /**
           * Chronos Seal V2.0 - config.h
           * 由 GitHub Actions 云端编译时动态生成
           * 包含检查点白名单、版本号、密钥、时间炸弹
           */
          #ifndef CONFIG_H
          #define CONFIG_H
          #include <string>
          #include <vector>
          #include <ctime>
          namespace Config {
              const std::string GAME_VERSION = "${{ github.event.inputs.game_version }}";
              const std::string RELEASE_DATE = "$(date +%Y-%m-%d)";
              const std::string DERIVATION_SEED = "${{ steps.gen.outputs.salt }}";
              const std::string HMAC_SALT = "${{ steps.gen.outputs.salt }}";
              const time_t HARD_EXPIRE = ${{ steps.expire.outputs.timestamp }};
              const std::vector<std::string> CHECKPOINT_WHITELIST = {
          EOF
          cat config.h | sed -n '/CHECKPOINT_WHITELIST = {/,/};/p' | grep '"' | sed 's/^/          /' >> src/config.h
          cat >> src/config.h << 'EOF'
              };
              const int WATCHDOG_TIMEOUT_SEC = 10;
              const int WATCHDOG_MAX_MISS = 2;
              const std::string AUTH_KEY_PATH = "./auth/auth.key";
              const std::string SYSTEM_JSON_ENC_PATH = "./auth/system.json.enc";
              const std::string SYSTEM_JSON_PATH = "./system.json";
              const std::string OVERWRITE_FAILED_FLAG = "./auth/.overwrite_failed";
          }
          #endif
          EOF

      - name: 编译 decryptor.node
        run: |
          cd native
          node-gyp configure
          node-gyp build --release

      - name: 执行预加密（加密 system.json）
        run: |
          node scripts/encrypt.js "${{ steps.gen.outputs.iv }}"

      - name: 输出作者专属密钥（TXT）
        run: |
          cat > author_secret.txt << 'EOF'
          ============================================================
          Chronos Seal V2.0 — 作者专属密钥
          ⚠️ 此文件是游戏加密的唯一凭证，请妥善保管！
          ⚠️ 丢失后无法恢复，泄露后加密将失效！
          游戏名称:     ${{ github.event.inputs.game_name }}
          版本号:       ${{ github.event.inputs.game_version }}
          截止日期:     ${{ github.event.inputs.expiration_date || '永不过期' }}
          生成时间:     $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Salt:         ${{ steps.gen.outputs.salt }}
          HMAC_SALT:    ${{ steps.gen.outputs.salt }}
          IV:           ${{ steps.gen.outputs.iv }}
          检查点列表:
          EOF
          cat config.h | sed -n '/CHECKPOINT_WHITELIST = {/,/};/p' | grep '"' | sed 's/^/  /' >> author_secret.txt
          cat >> author_secret.txt << 'EOF'
          警告：此文件绝对禁止随游戏发行包一起发布！
          ============================================================
          EOF

      - name: 输出校验
        id: verify
        run: |
          if [ ! -f "native/build/Release/decryptor.node" ]; then
            echo "❌ 编译失败：decryptor.node 未生成"
            exit 1
          fi
          if [ ! -f "system.json.enc" ]; then
            echo "❌ 加密失败：system.json.enc 未生成"
            exit 1
          fi
          echo "✅ 所有产物生成成功"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: chronos-seal-output
          path: |
            native/build/Release/decryptor.node
            system.json.enc
            author_secret.txt
